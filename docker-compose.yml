services:
  postgres:
    image: postgres:16-alpine
    container_name: capacity-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: capacity123
      POSTGRES_DB: capacity_planner
    ports:
      # Host 5433 avoids conflict with a local Postgres already on 5432
      - "5433:5432"
    volumes:
      - capacity_planner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capacity -d capacity_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  capacity_planner_pgdata:
